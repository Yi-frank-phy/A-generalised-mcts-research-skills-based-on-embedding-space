name: Apply Canonical DTE Spec

on:
  push:
    branches:
      - fix/canonical-dte-math
    paths:
      - ".github/canonical-spec-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canonical-dte-math
      - name: Apply exact specification replacements
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          pairs = [
              ("", ""),
              ("RFRFJ3MgZW50cm9weSBjb250cm9sbGVyIHJlcXVpcmVzIGEgY29udGludW91cyBlbWJlZGRpbmcgZ2VvbWV0cnk6CgpgYGB0ZXh0CnhfaSA9IEUodl9pKQpyaG9faSA9IEtERSh4X2kpClNfdCA9IC1tZWFuKGxvZyByaG9faSkKYGBgCg==", ""),
              ("R2l2ZW4gYWxsb2NhdGlvbiB2YWx1ZXMgYEFfaWAsIHRlbXBlcmF0dXJlIGBUYCwgYW5kIGEgcGVyLWl0ZXJhdGlvbiBhbGxvY2F0aW9uIG1hc3MgYENgOgoKYGBgdGV4dApwX2kgPSBleHAoQV9pIC8gVCkgLyBzdW1faiBleHAoQV9qIC8gVCkKcV9pID0gQyAqIHBfaQpgYGAK", ""),
              ("QnkgZGVmYXVsdCBgQV9pID0gVV9pYCwgc28gZW50cm9weSBhbmQgdW5jZXJ0YWludHkgYWZmZWN0IGFjdHVhbCBleHBhbnNpb24gcmF0aGVyIHRoYW4gbWVyZWx5IGRpc3BsYXkgcmFua2luZy4KCkVudHJvcHkgY29udHJvbHMgdGVtcGVyYXR1cmUgYW5kIGVtaXRzIGEgcmVwbGF5YWJsZSBwbGF0ZWF1IHNpZ25hbC4=", "")
          ]
          path = Path("SPEC.md")
          text = path.read_text(encoding="utf-8")
          for old64, new64 in pairs:
              old = base64.b64decode(old64).decode("utf-8")
              new = base64.b64decode(new64).decode("utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one SPEC target, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          if git grep -n 'U_i = V_i + c \* tau \* uncertainty_i' -- SPEC.md; then exit 1; fi
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SPEC.md
          git commit -m "docs: restore canonical DTE controller mathematics"
          git push origin HEAD:fix/canonical-dte-math
