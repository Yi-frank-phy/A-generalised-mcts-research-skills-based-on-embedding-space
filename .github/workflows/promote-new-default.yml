name: Promote new as default branch

on:
  push:
    branches:
      - new
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    if: github.ref == 'refs/heads/new'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Replace obsolete default main with current new release line
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          desired_sha="$GITHUB_SHA"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/branches/new/rename" -f new_name=new-release-tmp
          gh api --method POST "repos/${GITHUB_REPOSITORY}/branches/main/rename" -f new_name=new
          git push origin "${desired_sha}:refs/heads/new" --force
          git push origin --delete new-release-tmp
          echo "default=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          git ls-remote --heads origin
