name: CI

on:
  push:
    branches:
      - new
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  judge-phase2:
    name: Migrate retired Judge tests
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-generic-judge'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remove-generic-judge
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Remove tests for deleted Judge APIs
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          TESTS = Path("tests")
          EXEMPT = {"test_no_generic_judge.py"}

          def source_start(node: ast.AST) -> int:
              line = getattr(node, "lineno", 1)
              decorators = getattr(node, "decorator_list", [])
              if decorators:
                  line = min(line, *(item.lineno for item in decorators))
              return line - 1

          def assigned_names(node: ast.AST) -> set[str]:
              targets = []
              if isinstance(node, ast.Assign):
                  targets = list(node.targets)
              elif isinstance(node, ast.AnnAssign):
                  targets = [node.target]
              names: set[str] = set()
              for target in targets:
                  for item in ast.walk(target):
                      if isinstance(item, ast.Name):
                          names.add(item.id)
              return names

          def remove_ranges(text: str, nodes: list[ast.AST]) -> str:
              lines = text.splitlines(keepends=True)
              ranges = sorted(
                  (
                      (source_start(node), getattr(node, "end_lineno", getattr(node, "lineno", 1)))
                      for node in nodes
                  ),
                  reverse=True,
              )
              for start, end in ranges:
                  del lines[start:end]
              return "".join(lines)

          def render_alias(alias: ast.alias) -> str:
              return alias.name if alias.asname is None else f"{alias.name} as {alias.asname}"

          def prune_imports(text: str) -> str:
              tree = ast.parse(text)
              lines = text.splitlines(keepends=True)
              edits: list[tuple[int, int, str]] = []
              for node in tree.body:
                  if isinstance(node, ast.ImportFrom):
                      remaining = [
                          alias
                          for alias in node.names
                          if "judge" not in alias.name.lower()
                          and "judge" not in (alias.asname or "").lower()
                      ]
                      if len(remaining) == len(node.names):
                          continue
                      module = "." * node.level + (node.module or "")
                      replacement = (
                          ""
                          if not remaining
                          else f"from {module} import {', '.join(render_alias(alias) for alias in remaining)}\n"
                      )
                      edits.append((node.lineno - 1, node.end_lineno or node.lineno, replacement))
                  elif isinstance(node, ast.Import):
                      remaining = [
                          alias
                          for alias in node.names
                          if "judge" not in alias.name.lower()
                          and "judge" not in (alias.asname or "").lower()
                      ]
                      if len(remaining) == len(node.names):
                          continue
                      replacement = (
                          ""
                          if not remaining
                          else f"import {', '.join(render_alias(alias) for alias in remaining)}\n"
                      )
                      edits.append((node.lineno - 1, node.end_lineno or node.lineno, replacement))
              for start, end, replacement in sorted(edits, reverse=True):
                  lines[start:end] = [replacement] if replacement else []
              result = "".join(lines)
              ast.parse(result)
              return result

          for path in sorted(TESTS.glob("test_*.py")):
              if path.name in EXEMPT:
                  continue
              if "judge" in path.name.lower():
                  path.unlink()
                  continue

              text = path.read_text(encoding="utf-8")
              tree = ast.parse(text, filename=str(path))
              removable: dict[int, ast.AST] = {}
              removed_names: set[str] = set()

              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      segment = ast.get_source_segment(text, node) or ""
                      if "judge" in segment.lower():
                          removable[id(node)] = node
                          removed_names.add(node.name)
                  elif isinstance(node, (ast.Assign, ast.AnnAssign)):
                      segment = ast.get_source_segment(text, node) or ""
                      if "judge" in segment.lower():
                          removable[id(node)] = node
                          removed_names.update(assigned_names(node))

              changed = True
              while changed and removed_names:
                  changed = False
                  for node in tree.body:
                      if id(node) in removable or not isinstance(
                          node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)
                      ):
                          continue
                      referenced = {
                          item.id
                          for item in ast.walk(node)
                          if isinstance(item, ast.Name)
                      }
                      if referenced & removed_names:
                          removable[id(node)] = node
                          removed_names.add(node.name)
                          changed = True

              if removable:
                  text = remove_ranges(text, list(removable.values()))
              text = prune_imports(text)
              ast.parse(text, filename=str(path))
              path.write_text(text, encoding="utf-8")
          PY
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Verify test collection
        run: python -m pytest --collect-only -q
      - name: Commit migrated tests
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No retired Judge tests remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests
          git commit -m "test: retire generic Judge coverage"
          git push origin HEAD:agent/remove-generic-judge

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: judge-phase2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remove-generic-judge
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Refresh generated release metadata
        run: |
          python scripts/generate_bundle_manifest.py
          python -c "from pathlib import Path; data=Path('bundle-manifest.json').read_bytes(); target=Path('deploy/managed-template/bundle-manifest.json'); target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(data)"
          python scripts/generate_bundle_manifest.py --verify
      - name: Unit tests
        run: python -m pytest -q
      - name: Smoke workflow
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python scripts/smoke_workflow.py

  package:
    name: Backend wheel and repository Skill bundle
    needs: judge-phase2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remove-generic-judge
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install runtime for release verification
        run: python -m pip install -e .
      - name: Verify committed release metadata
        run: |
          python scripts/generate_bundle_manifest.py --verify
          python - <<'PY'
          from pathlib import Path

          root = Path("bundle-manifest.json").read_bytes()
          managed = Path("deploy/managed-template/bundle-manifest.json").read_bytes()
          assert root == managed, "managed-template bundle manifest differs from root bundle manifest"
          PY
      - name: Build backend wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify backend wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/dte-wheel-venv"
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" -m dte_backend hook-driver --help
          "$RUNNER_TEMP/dte-wheel-venv/bin/dte-backend" hook-driver --help
      - name: Verify repository Skill bundle
        run: |
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" scripts/install_skill_bundle.py --source . --target "$RUNNER_TEMP/dte-installed-skill"
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" "$RUNNER_TEMP/dte-installed-skill/scripts/dte_hook_driver_entry.py" hook-driver --help
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path.cwd()
          required = [
              root / "SKILL.md",
              root / "hooks" / "dte_enforcement_hook.py",
              root / "bundle-manifest.json",
              root / "scripts" / "dte_hook_driver_entry.py",
              root / "scripts" / "install_dte_hooks.py",
              root / "deploy" / "managed-template" / "requirements.toml",
              root / "deploy" / "managed-template" / "hooks" / "dte_enforcement_hook.py",
              root / "deploy" / "managed-template" / "bundle-manifest.json",
          ]
          missing = [str(path.relative_to(root)) for path in required if not path.is_file()]
          assert not missing, f"missing repository Skill files: {missing}"
          source = required[1].read_bytes()
          assert required[6].read_bytes() == source
          assert required[2].read_bytes() == required[7].read_bytes()
          digest = hashlib.sha256(source).hexdigest()
          requirements = required[5].read_text(encoding="utf-8")
          assert requirements.count(f"--dte-hook-content-sha256={digest}") == 10
          assert requirements.count("--dte-skill-root=") == 10
          PY
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" scripts/install_dte_hooks.py --scope managed-template
