name: Apply generic Judge removal

on:
  push:
    branches:
      - agent/remove-generic-judge
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase2-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remove-generic-judge
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e .[dev]

      - name: Reassert phase-1 migration
        run: python scripts/remove_generic_judge_phase1.py

      - name: Correct phase-2 codemod assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/remove_generic_judge_phase2.py")
          text = path.read_text(encoding="utf-8")

          first = '    text = replace_exact(text, run_block, "", "CLI flexible-run Judge adapter")\n'
          second = '    text = replace_exact(text, run_block, "", "CLI strict-run Judge adapter")\n'
          exact = first + second
          if text.count(exact) != 1:
              raise SystemExit("phase-2 CLI assertion patch did not match exactly once")
          text = text.replace(
              exact,
              '    text = replace_exact(text, run_block, "", "CLI Judge adapter blocks", count=2)\n',
              1,
          )

          old_end_guard = '    require_count(text, end, 1, f"{label} end")\n'
          new_end_guard = (
              '    if end not in text:\n'
              '        raise RuntimeError(f"{label} end: marker not found")\n'
          )
          if text.count(old_end_guard) != 1:
              raise SystemExit("phase-2 end-marker assertion patch did not match exactly once")
          text = text.replace(old_end_guard, new_end_guard, 1)

          old_range = '        ((node.lineno - 1, node.end_lineno or node.lineno) for node in found.values()),\n'
          new_range = (
              '        ((min([node.lineno, *[item.lineno for item in getattr(node, "decorator_list", [])]]) - 1, '
              'node.end_lineno or node.lineno) for node in found.values()),\n'
          )
          if text.count(old_range) != 1:
              raise SystemExit("phase-2 decorator-safe range patch did not match exactly once")
          text = text.replace(old_range, new_range, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply fail-closed phase-2 migration
        shell: bash
        run: |
          set -o pipefail
          python scripts/remove_generic_judge_phase2.py 2>&1 | tee judge-removal-codemod.log

      - name: Capture post-codemod snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-removal-post-codemod
          path: |
            src/
            tests/
            scripts/
            prompts/
            schemas/
            docs/
            hooks/
            SKILL.md
            README.md
            ARCHITECTURE.md
            PRD.md
            PROTOTYPE.md
            SPEC.md
            pyproject.toml
          include-hidden-files: true
          if-no-files-found: error

      - name: Verify focused GREEN
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_no_generic_judge.py -q 2>&1 | tee judge-removal-focused.log

      - name: Run full regression
        id: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=judge-removal-pytest.xml 2>&1 | tee judge-removal-pytest.log

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-removal-regression
          path: |
            judge-removal-codemod.log
            judge-removal-focused.log
            judge-removal-pytest.log
            judge-removal-pytest.xml
          if-no-files-found: warn

      - name: Refresh public release metadata
        run: |
          python scripts/generate_bundle_manifest.py
          python -c "from pathlib import Path; data=Path('bundle-manifest.json').read_bytes(); target=Path('deploy/managed-template/bundle-manifest.json'); target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(data)"
          python scripts/generate_bundle_manifest.py --verify

      - name: Commit verified migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove generic Judge production surface"
          git push origin HEAD:agent/remove-generic-judge
