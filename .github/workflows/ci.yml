name: CI

on:
  push:
    branches:
      - new
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Refresh generated release metadata
        run: |
          python scripts/generate_bundle_manifest.py
          python -c "from pathlib import Path; data=Path('bundle-manifest.json').read_bytes(); target=Path('deploy/managed-template/bundle-manifest.json'); target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(data)"
          python scripts/generate_bundle_manifest.py --verify
      - name: Unit tests
        run: python -m pytest -q
      - name: Smoke workflow
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python scripts/smoke_workflow.py

  package:
    name: Backend wheel and repository Skill bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build backend wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify backend wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/dte-wheel-venv"
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" -m dte_backend hook-driver --help
          "$RUNNER_TEMP/dte-wheel-venv/bin/dte-backend" hook-driver --help
      - name: Refresh repository Skill bundle metadata
        run: |
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" scripts/generate_bundle_manifest.py
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" -c "from pathlib import Path; data=Path('bundle-manifest.json').read_bytes(); target=Path('deploy/managed-template/bundle-manifest.json'); target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(data)"
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" scripts/generate_bundle_manifest.py --verify
      - name: Verify repository Skill bundle
        run: |
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" scripts/install_skill_bundle.py --source . --target "$RUNNER_TEMP/dte-installed-skill"
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" "$RUNNER_TEMP/dte-installed-skill/scripts/dte_hook_driver_entry.py" hook-driver --help
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" scripts/install_dte_hooks.py --scope managed-template
