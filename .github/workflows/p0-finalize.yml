name: P0 Finalize

on:
  push:
    branches:
      - fix/p0-adaptive-kde-scale
    paths:
      - .github/workflows/p0-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/p0-adaptive-kde-scale
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply exact specification cleanup
        run: python scripts/p0_finalize_branch.py
      - name: Install test dependencies
        run: python -m pip install -e .[dev]
      - name: Regenerate and verify production bundle
        run: |
          python scripts/generate_bundle_manifest.py
          python scripts/generate_bundle_manifest.py --verify
      - name: Full regression with current bundle
        run: python -m pytest -q
      - name: Commit final P0 state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize P0 DTE geometry controller recovery"
          git push origin HEAD:fix/p0-adaptive-kde-scale
