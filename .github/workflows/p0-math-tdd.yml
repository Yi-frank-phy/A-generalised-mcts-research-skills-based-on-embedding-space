name: P0 Math TDD

on:
  push:
    branches:
      - fix/p0-adaptive-kde-scale
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Focused math tests
        # Temporary P0 gate; removed after the full bundle CI is restored.
        run: >-
          python -m pytest
          tests/test_kde.py
          tests/test_entropy.py
          tests/test_math_engine.py
          tests/test_canonical_controller_math.py
          -q
