name: P0 Math TDD

on:
  push:
    branches:
      - fix/p0-adaptive-kde-scale
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Full pytest before bundle refresh
        # Temporary P0 gate; removed after the production bundle manifest is regenerated.
        run: python -m pytest -q
