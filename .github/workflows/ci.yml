name: CI

on:
  push:
    branches:
      - new
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  judge-phase2:
    name: Repair Judge-removal observability residue
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-generic-judge'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remove-generic-judge
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Repair observability residue
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("src/dte_backend/observability.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace("    JudgeEpisodeOutput,\n", "")
          text = text.replace(
              "elif isinstance(structured, (JudgeEpisodeOutput, RelationEpisodeOutput)):",
              "elif isinstance(structured, RelationEpisodeOutput):",
          )

          tree = ast.parse(text)
          target = next(
              (
                  node
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == "_committed_judge_observations"
              ),
              None,
          )
          if target is not None:
              lines = text.splitlines(keepends=True)
              del lines[target.lineno - 1 : target.end_lineno or target.lineno]
              text = "".join(lines)

          text = text.replace(
              "    judge_observations = _committed_judge_observations(state, recoverable)\n",
              "    judge_observations: dict[str, tuple[Any, Any, Any]] = {}\n",
          )
          text = text.replace("node.judge_reasoning", 'getattr(node, "judge_reasoning", None)')
          text = text.replace("node.judge_risks", 'getattr(node, "judge_risks", [])')
          text = text.replace(
              "node.judge_uncertainty_evidence",
              'getattr(node, "judge_uncertainty_evidence", [])',
          )
          text = text.replace(
              "node.judge_result_provenance",
              'getattr(node, "judge_result_provenance", None)',
          )

          ast.parse(text, filename=str(path))
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Verify focused removal tests
        run: python -m pytest tests/test_no_generic_judge.py -q
      - name: Refresh generated release metadata
        run: |
          python scripts/generate_bundle_manifest.py
          python -c "from pathlib import Path; data=Path('bundle-manifest.json').read_bytes(); target=Path('deploy/managed-template/bundle-manifest.json'); target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(data)"
          python scripts/generate_bundle_manifest.py --verify
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove residual Judge observability dependency"
          git push origin HEAD:agent/remove-generic-judge

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: judge-phase2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remove-generic-judge
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Refresh generated release metadata
        run: |
          python scripts/generate_bundle_manifest.py
          python -c "from pathlib import Path; data=Path('bundle-manifest.json').read_bytes(); target=Path('deploy/managed-template/bundle-manifest.json'); target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(data)"
          python scripts/generate_bundle_manifest.py --verify
      - name: Unit tests
        run: python -m pytest -q
      - name: Smoke workflow
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python scripts/smoke_workflow.py

  package:
    name: Backend wheel and repository Skill bundle
    needs: judge-phase2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remove-generic-judge
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install runtime for release verification
        run: python -m pip install -e .
      - name: Verify committed release metadata
        run: |
          python scripts/generate_bundle_manifest.py --verify
          python - <<'PY'
          from pathlib import Path

          root = Path("bundle-manifest.json").read_bytes()
          managed = Path("deploy/managed-template/bundle-manifest.json").read_bytes()
          assert root == managed, "managed-template bundle manifest differs from root bundle manifest"
          PY
      - name: Build backend wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify backend wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/dte-wheel-venv"
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" -m dte_backend hook-driver --help
          "$RUNNER_TEMP/dte-wheel-venv/bin/dte-backend" hook-driver --help
      - name: Verify repository Skill bundle
        run: |
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" scripts/install_skill_bundle.py --source . --target "$RUNNER_TEMP/dte-installed-skill"
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" "$RUNNER_TEMP/dte-installed-skill/scripts/dte_hook_driver_entry.py" hook-driver --help
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path.cwd()
          required = [
              root / "SKILL.md",
              root / "hooks" / "dte_enforcement_hook.py",
              root / "bundle-manifest.json",
              root / "scripts" / "dte_hook_driver_entry.py",
              root / "scripts" / "install_dte_hooks.py",
              root / "deploy" / "managed-template" / "requirements.toml",
              root / "deploy" / "managed-template" / "hooks" / "dte_enforcement_hook.py",
              root / "deploy" / "managed-template" / "bundle-manifest.json",
          ]
          missing = [str(path.relative_to(root)) for path in required if not path.is_file()]
          assert not missing, f"missing repository Skill files: {missing}"
          source = required[1].read_bytes()
          assert required[6].read_bytes() == source
          assert required[2].read_bytes() == required[7].read_bytes()
          digest = hashlib.sha256(source).hexdigest()
          requirements = required[5].read_text(encoding="utf-8")
          assert requirements.count(f"--dte-hook-content-sha256={digest}") == 10
          assert requirements.count("--dte-skill-root=") == 10
          PY
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" scripts/install_dte_hooks.py --scope managed-template
