name: Refresh release metadata once

on:
  push:
    branches:
      - new
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-release-metadata-new
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: new
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install runtime
        run: python -m pip install -e .
      - name: Regenerate committed bundle metadata
        run: |
          python scripts/generate_bundle_manifest.py
          python -c "from pathlib import Path; data=Path('bundle-manifest.json').read_bytes(); target=Path('deploy/managed-template/bundle-manifest.json'); target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(data)"
          python scripts/generate_bundle_manifest.py --verify
      - name: Commit refreshed metadata and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-release-metadata.yml
          git add bundle-manifest.json deploy/managed-template/bundle-manifest.json
          git diff --cached --check
          git commit -m "chore: refresh release bundle metadata"
          git push origin HEAD:new
