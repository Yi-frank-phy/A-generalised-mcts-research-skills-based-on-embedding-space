name: CI

on:
  push:
    branches:
      - new
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  judge-phase2:
    name: Repair post-Judge regressions
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-generic-judge'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remove-generic-judge
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply regression repairs
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"{label}: expected exactly one old block")
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"{label}: neither old nor repaired block found")
              if path.suffix == ".py":
                  ast.parse(text, filename=str(path))
              path.write_text(text, encoding="utf-8")

          # Canonical merge selection must use current node facts only. Generic
          # Judge score/provenance can no longer influence the representative.
          replace_once(
              Path("src/dte_backend/merge.py"),
              "            -(node.score if node.score is not None else node.confidence),\n"
              "            -(1 if node.judge_result_provenance else 0),\n",
              "            -node.confidence,\n",
              "merge canonical Judge ranking",
          )

          # Remove the retired standalone Judge guard while preserving spec,
          # executor, and relation guard surfaces.
          guard_path = Path("hooks/dte_guard.py")
          guard = guard_path.read_text(encoding="utf-8")
          guard = guard.replace("    validate_judge_output,\n", "")
          tree = ast.parse(guard, filename=str(guard_path))
          judge_fn = next(
              (
                  node
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == "cmd_judge"
              ),
              None,
          )
          if judge_fn is not None:
              lines = guard.splitlines(keepends=True)
              start = min(
                  [judge_fn.lineno, *[item.lineno for item in judge_fn.decorator_list]]
              ) - 1
              del lines[start : judge_fn.end_lineno or judge_fn.lineno]
              guard = "".join(lines)
          judge_parser = (
              '    judge = sub.add_parser("judge")\n'
              '    judge.add_argument("--nodes", required=True)\n'
              '    judge.add_argument("--output", required=True)\n'
              '    judge.set_defaults(func=cmd_judge)\n\n'
          )
          if judge_parser in guard:
              guard = guard.replace(judge_parser, "", 1)
          elif 'sub.add_parser("judge")' in guard or "cmd_judge" in guard:
              raise SystemExit("retired Judge guard parser remains in an unexpected shape")
          ast.parse(guard, filename=str(guard_path))
          guard_path.write_text(guard, encoding="utf-8")

          # The removed SearchNode Judge fields are no longer valid controller-owned
          # initial-state cases; keep the real controller-owned field checks.
          regression_path = Path("tests/test_app_post_merge_regressions.py")
          regression = regression_path.read_text(encoding="utf-8")
          for line in (
              '        {"judge_reasoning": "prefilled"},\n',
              '        {"judge_risks": ["prefilled"]},\n',
              '        {"judge_uncertainty_evidence": ["prefilled"]},\n',
              '        {"judge_result_provenance": {"episode_id": "forged"}},\n',
          ):
              regression = regression.replace(line, "")
          ast.parse(regression, filename=str(regression_path))
          regression_path.write_text(regression, encoding="utf-8")

          # Generic Judge score is no longer produced in the mandatory loop;
          # geometry/controller facts must still be produced.
          executor_test = Path("tests/test_executor_adapter.py")
          replace_once(
              executor_test,
              "    assert result.nodes[0].score is not None\n"
              "    assert result.nodes[-1].score is None\n",
              "    assert result.nodes[0].score is None\n"
              "    assert result.nodes[0].density is not None\n"
              "    assert result.nodes[0].uncertainty is not None\n"
              "    assert result.nodes[0].ucb_score is not None\n"
              "    assert result.nodes[-1].score is None\n",
              "runner no-Judge score expectation",
          )

          # Hook-driver fixtures now reach geometry immediately, so their active
          # seed nodes must satisfy the new-line completed-transition invariant.
          hook_test = Path("tests/test_hook_enforcement.py")
          replace_once(
              hook_test,
              '                    "rationale": "seed",\n'
              '                    "status": "frontier",\n',
              '                    "rationale": "seed",\n'
              '                    "retrospective_method": "initial candidate framing",\n'
              '                    "epistemic_change_kind": "sharper_unknown",\n'
              '                    "epistemic_change": "Established the initial bounded candidate for investigation.",\n'
              '                    "status": "frontier",\n',
              "hook fixture completed transition",
          )

          bundle_test = Path("tests/test_bundle_manifest.py")
          replace_once(
              bundle_test,
              '        json.dumps([{"node_id": "seed", "claim": "installed copy probe"}]),\n',
              '        json.dumps([{"node_id": "seed", "claim": "installed copy probe", '
              '"retrospective_method": "installed-copy initialization", '
              '"epistemic_change_kind": "sharper_unknown", '
              '"epistemic_change": "Established the installed-copy probe as an active completed transition."}]),\n',
              "installed-copy completed transition",
          )

          # Refresh checked-in machine schemas from the canonical current models.
          from dte_backend.models import ExpansionRequest, SearchNode

          for filename, model in (
              ("search_node.schema.json", SearchNode),
              ("expansion_request.schema.json", ExpansionRequest),
          ):
              path = Path("schemas") / filename
              path.write_text(
                  json.dumps(
                      model.model_json_schema(mode="serialization"),
                      ensure_ascii=False,
                      indent=2,
                  )
                  + "\n",
                  encoding="utf-8",
              )
          PY
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Refresh generated release metadata
        run: |
          python scripts/generate_bundle_manifest.py
          python -c "from pathlib import Path; data=Path('bundle-manifest.json').read_bytes(); target=Path('deploy/managed-template/bundle-manifest.json'); target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(data)"
          python scripts/generate_bundle_manifest.py --verify
      - name: Run targeted regression
        run: >-
          python -m pytest -q
          tests/test_no_generic_judge.py
          tests/test_merge.py
          tests/test_relation_workflow.py
          tests/test_app_relation_readiness.py
          tests/test_hooks.py
          tests/test_smoke_workflow.py
          tests/test_hook_enforcement.py
          tests/test_bundle_manifest.py
          tests/test_executor_adapter.py
          tests/test_schema.py
          tests/test_app_post_merge_regressions.py
      - name: Commit verified repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No post-Judge repairs remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair post-Judge regressions"
          git push origin HEAD:agent/remove-generic-judge

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: judge-phase2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remove-generic-judge
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Refresh generated release metadata
        run: |
          python scripts/generate_bundle_manifest.py
          python -c "from pathlib import Path; data=Path('bundle-manifest.json').read_bytes(); target=Path('deploy/managed-template/bundle-manifest.json'); target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(data)"
          python scripts/generate_bundle_manifest.py --verify
      - name: Unit tests
        run: python -m pytest -q
      - name: Smoke workflow
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python scripts/smoke_workflow.py

  package:
    name: Backend wheel and repository Skill bundle
    needs: judge-phase2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remove-generic-judge
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install runtime for release verification
        run: python -m pip install -e .
      - name: Verify committed release metadata
        run: |
          python scripts/generate_bundle_manifest.py --verify
          python - <<'PY'
          from pathlib import Path

          root = Path("bundle-manifest.json").read_bytes()
          managed = Path("deploy/managed-template/bundle-manifest.json").read_bytes()
          assert root == managed, "managed-template bundle manifest differs from root bundle manifest"
          PY
      - name: Build backend wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify backend wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/dte-wheel-venv"
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" -m dte_backend hook-driver --help
          "$RUNNER_TEMP/dte-wheel-venv/bin/dte-backend" hook-driver --help
      - name: Verify repository Skill bundle
        run: |
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" scripts/install_skill_bundle.py --source . --target "$RUNNER_TEMP/dte-installed-skill"
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" "$RUNNER_TEMP/dte-installed-skill/scripts/dte_hook_driver_entry.py" hook-driver --help
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path.cwd()
          required = [
              root / "SKILL.md",
              root / "hooks" / "dte_enforcement_hook.py",
              root / "bundle-manifest.json",
              root / "scripts" / "dte_hook_driver_entry.py",
              root / "scripts" / "install_dte_hooks.py",
              root / "deploy" / "managed-template" / "requirements.toml",
              root / "deploy" / "managed-template" / "hooks" / "dte_enforcement_hook.py",
              root / "deploy" / "managed-template" / "bundle-manifest.json",
          ]
          missing = [str(path.relative_to(root)) for path in required if not path.is_file()]
          assert not missing, f"missing repository Skill files: {missing}"
          source = required[1].read_bytes()
          assert required[6].read_bytes() == source
          assert required[2].read_bytes() == required[7].read_bytes()
          digest = hashlib.sha256(source).hexdigest()
          requirements = required[5].read_text(encoding="utf-8")
          assert requirements.count(f"--dte-hook-content-sha256={digest}") == 10
          assert requirements.count("--dte-skill-root=") == 10
          PY
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" scripts/install_dte_hooks.py --scope managed-template
