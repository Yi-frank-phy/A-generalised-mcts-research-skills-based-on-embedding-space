name: Canonical DTE Math TDD

on:
  pull_request:
    paths:
      - "src/dte_backend/**"
      - "tests/**"
      - ".github/workflows/tdd-canonical-math.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Focused controller tests
        run: python -m pytest tests/test_math_engine.py tests/test_entropy.py tests/test_runner.py -q
      # Retrigger marker: canonical wiring verified.
