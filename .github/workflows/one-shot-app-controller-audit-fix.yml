name: One-shot App controller audit fix

on:
  push:
    branches:
      - agent/fix-controller-audit-bugs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply audited App geometry wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/dte_backend/app_driver.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          starts = [
              i
              for i, line in enumerate(lines)
              if line.strip() == "next_frontier, kde_state = estimate_frontier_kde_state("
          ]
          if len(starts) != 1:
              raise SystemExit(f"expected exactly one App scoring call, found {len(starts)}")
          start = starts[0]
          window_end = min(len(lines), start + 16)
          if any("graph_k=state.spec.budget.controller_graph_k" in line for line in lines[start:window_end]):
              raise SystemExit("App geometry wiring is already present")
          expected = next(
              (
                  i
                  for i in range(start, window_end)
                  if lines[i].strip() == "expected_dimension=state.spec.embedding_dimension,"
              ),
              None,
          )
          if expected is None:
              raise SystemExit("could not locate App expected_dimension argument")
          indent = lines[expected][: len(lines[expected]) - len(lines[expected].lstrip())]
          lines[expected + 1:expected + 1] = [
              f"{indent}graph_k=state.spec.budget.controller_graph_k,\n",
              f"{indent}volume_bandwidth=state.spec.budget.volume_bandwidth,\n",
          ]
          path.write_text("".join(lines), encoding="utf-8")
          Path(".github/workflows/one-shot-app-controller-audit-fix.yml").unlink()
          PY
      - name: Refresh deterministic bundle metadata
        run: |
          python -m pip install -e .
          python scripts/generate_bundle_manifest.py > /dev/null
          cp bundle-manifest.json deploy/managed-template/bundle-manifest.json
      - name: Commit audited patch and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dte_backend/app_driver.py bundle-manifest.json deploy/managed-template/bundle-manifest.json .github/workflows/one-shot-app-controller-audit-fix.yml
          git commit -m "fix: wire App controller geometry knobs"
          git push origin HEAD:${GITHUB_REF_NAME}
