name: Refresh DTE Bundle Manifest

on:
  push:
    branches:
      - fix/canonical-dte-math
    paths:
      - ".github/refresh-bundle-manifest-trigger"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canonical-dte-math
      - name: Generate canonical manifests
        run: |
          python scripts/generate_bundle_manifest.py > /dev/null
          cp bundle-manifest.json deploy/managed-template/bundle-manifest.json
          python scripts/generate_bundle_manifest.py --verify > /dev/null
          cmp bundle-manifest.json deploy/managed-template/bundle-manifest.json
          git diff --check
      - name: Commit generated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bundle-manifest.json deploy/managed-template/bundle-manifest.json
          git commit -m "chore: refresh DTE bundle manifest"
          git push origin HEAD:fix/canonical-dte-math
