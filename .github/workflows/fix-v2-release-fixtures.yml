name: Fix v2 release fixtures

on:
  push:
    branches:
      - new
    paths:
      - .github/workflows/fix-v2-release-fixtures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Migrate remaining v2 fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_observability.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'def run_spec(*, enrichment=0, cap=2, iterations=1) -> DTERunSpec:',
              'def run_spec(*, enrichment=0, cap=2, iterations=1, allocation_mass=1) -> DTERunSpec:',
              1,
          )
          text = text.replace(
              '            allocation_mass_per_iteration=1,\n',
              '            allocation_mass_per_iteration=allocation_mass,\n',
              1,
          )
          old = '''    create_app_run(\n        run_dir,\n        run_spec(),\n        [\n            completed_node(node_id="p0", claim="parent zero"),\n            completed_node(node_id="p1", claim="parent one"),\n        ],\n        run_id=f"run-{relation_type}",\n    )\n    judge = next_app_episode(run_dir).request\n    submit_app_episode_result(run_dir, judge_result(judge))\n    child_ids = []\n    for index in range(2):\n        executor = next_app_episode(\n            run_dir, embedding_provider=HashEmbeddingProvider(dim=8)\n        ).request\n        assert executor.role == "executor"\n        child_id = f"child-{index}"\n        submit_app_episode_result(\n            run_dir,\n            executor_result(\n                executor,\n                child_id=child_id,\n                claim=claims[index],\n                evidence=evidence[index],\n            ),\n        )\n        child_ids.append(child_id)\n'''
          new = '''    create_app_run(\n        run_dir,\n        run_spec(allocation_mass=2),\n        [\n            completed_node(node_id="p0", claim="parent zero"),\n            completed_node(node_id="p1", claim="parent one"),\n        ],\n        run_id=f"run-{relation_type}",\n    )\n    judge = next_app_episode(run_dir).request\n    submit_app_episode_result(run_dir, judge_result(judge))\n    executor = next_app_episode(\n        run_dir, embedding_provider=HashEmbeddingProvider(dim=8)\n    ).request\n    assert executor.role == "executor"\n    child_ids = ["child-0", "child-1"]\n    output = ExecutorEpisodeOutput(\n        nodes=[\n            completed_candidate(\n                node_id=child_id,\n                claim=claims[index],\n                evidence=evidence[index],\n                parent_ids=[executor.parent_node_id],\n            )\n            for index, child_id in enumerate(child_ids)\n        ]\n    )\n    submit_app_episode_result(\n        run_dir,\n        EpisodeResult(\n            episode_id=executor.episode_id,\n            attempt_id=executor.attempt_id,\n            run_id=executor.run_id,\n            role=executor.role,\n            input_graph_revision=executor.input_graph_revision,\n            selected_node_revisions=executor.selected_node_revisions,\n            status="completed",\n            structured_output=output,\n            runtime_diagnostics=diagnostics(),\n            output_hash=compute_output_hash(output, executor.output_schema_version),\n            schema_version=executor.output_schema_version,\n        ),\n    )\n'''
          if old not in text:
              raise SystemExit('drive_relation_run fixture block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '    assert {tuple(node.parent_ids) for node in children.values()} == {("p0",), ("p1",)}\n',
              '    parent_sets = {tuple(node.parent_ids) for node in children.values()}\n    assert len(parent_sets) == 1\n    assert next(iter(parent_sets)) in {("p0",), ("p1",)}\n',
              1,
          )
          text = text.replace(
              '    assert len(summary.allocation_outcomes) == 2\n    assert all(item.actual_committed_children == 1 for item in summary.allocation_outcomes)\n',
              '    assert len(summary.allocation_outcomes) == 1\n    assert summary.allocation_outcomes[0].actual_committed_children == 2\n',
              1,
          )
          text = text.replace(
              '    assert summary.controller_trajectory[0].positive_budget_parent_count == 2\n',
              '    assert summary.controller_trajectory[0].positive_budget_parent_count == 1\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('scripts/smoke_epistemic_workflow.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '''                SearchNode(\n                    node_id="left",\n                    claim="the condition is sufficient",\n                    evidence=["shared premise"],\n                ),''',
              '''                SearchNode(\n                    node_id="left",\n                    claim="the condition is sufficient",\n                    evidence=["shared premise"],\n                    retrospective_method="analyze sufficiency under the shared premise",\n                    epistemic_change_kind="new_understanding",\n                    epistemic_change="identified a candidate sufficient-condition route",\n                ),''',
              1,
          )
          text = text.replace(
              '''                SearchNode(\n                    node_id="right",\n                    claim="the condition is not sufficient",\n                    evidence=["shared premise"],\n                ),''',
              '''                SearchNode(\n                    node_id="right",\n                    claim="the condition is not sufficient",\n                    evidence=["shared premise"],\n                    retrospective_method="analyze a boundary challenge under the shared premise",\n                    epistemic_change_kind="sharper_unknown",\n                    epistemic_change="isolated the boundary case where sufficiency remains disputed",\n                ),''',
              1,
          )
          text = text.replace(
              '''                ExecutorNodeCandidate(\n                    node_id=child_id,\n                    claim="the condition works away from the boundary",\n                    parent_ids=[executor.parent_node_id],\n                )''',
              '''                ExecutorNodeCandidate(\n                    node_id=child_id,\n                    claim="the condition works away from the boundary",\n                    parent_ids=[executor.parent_node_id],\n                    retrospective_method="perform the bounded away-from-boundary calculation",\n                    epistemic_change_kind="new_understanding",\n                    epistemic_change="established bounded support away from the unresolved boundary",\n                )''',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Targeted verification
        run: python -m pytest -q tests/test_observability.py tests/test_smoke_workflow.py
      - name: Commit verified migration and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-v2-release-fixtures.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: finish v2 transition fixture migration'
          git push origin HEAD:new
