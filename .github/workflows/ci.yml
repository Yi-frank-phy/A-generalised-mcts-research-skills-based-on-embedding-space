name: CI

on:
  push:
    branches:
      - new
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  judge-phase2:
    name: Apply Judge phase-2 migration
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-generic-judge'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remove-generic-judge
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Reassert phase-1 migration
        run: python scripts/remove_generic_judge_phase1.py
      - name: Correct phase-2 codemod assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/remove_generic_judge_phase2.py")
          text = path.read_text(encoding="utf-8")

          first = '    text = replace_exact(text, run_block, "", "CLI flexible-run Judge adapter")\n'
          second = '    text = replace_exact(text, run_block, "", "CLI strict-run Judge adapter")\n'
          exact = first + second
          if text.count(exact) != 1:
              raise SystemExit("phase-2 CLI assertion patch did not match exactly once")
          text = text.replace(
              exact,
              '    text = replace_exact(text, run_block, "", "CLI Judge adapter blocks", count=2)\n',
              1,
          )

          old_end_guard = '    require_count(text, end, 1, f"{label} end")\n'
          new_end_guard = (
              '    if end not in text:\n'
              '        raise RuntimeError(f"{label} end: marker not found")\n'
          )
          if text.count(old_end_guard) != 1:
              raise SystemExit("phase-2 end-marker assertion patch did not match exactly once")
          text = text.replace(old_end_guard, new_end_guard, 1)

          old_range = '        ((node.lineno - 1, node.end_lineno or node.lineno) for node in found.values()),\n'
          new_range = (
              '        ((min([node.lineno, *[item.lineno for item in getattr(node, "decorator_list", [])]]) - 1, '
              'node.end_lineno or node.lineno) for node in found.values()),\n'
          )
          if text.count(old_range) != 1:
              raise SystemExit("phase-2 decorator-safe range patch did not match exactly once")
          text = text.replace(old_range, new_range, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply fail-closed phase-2 migration
        run: python scripts/remove_generic_judge_phase2.py
      - name: Verify focused removal tests
        run: python -m pytest tests/test_no_generic_judge.py -q
      - name: Refresh generated release metadata
        run: |
          python scripts/generate_bundle_manifest.py
          python -c "from pathlib import Path; data=Path('bundle-manifest.json').read_bytes(); target=Path('deploy/managed-template/bundle-manifest.json'); target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(data)"
          python scripts/generate_bundle_manifest.py --verify
      - name: Commit migrated branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove generic Judge production surface"
          git push origin HEAD:agent/remove-generic-judge

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: judge-phase2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remove-generic-judge
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Refresh generated release metadata
        run: |
          python scripts/generate_bundle_manifest.py
          python -c "from pathlib import Path; data=Path('bundle-manifest.json').read_bytes(); target=Path('deploy/managed-template/bundle-manifest.json'); target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(data)"
          python scripts/generate_bundle_manifest.py --verify
      - name: Unit tests
        run: python -m pytest -q
      - name: Smoke workflow
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python scripts/smoke_workflow.py

  package:
    name: Backend wheel and repository Skill bundle
    needs: judge-phase2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remove-generic-judge
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install runtime for release verification
        run: python -m pip install -e .
      - name: Verify committed release metadata
        run: |
          python scripts/generate_bundle_manifest.py --verify
          python - <<'PY'
          from pathlib import Path

          root = Path("bundle-manifest.json").read_bytes()
          managed = Path("deploy/managed-template/bundle-manifest.json").read_bytes()
          assert root == managed, "managed-template bundle manifest differs from root bundle manifest"
          PY
      - name: Build backend wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify backend wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/dte-wheel-venv"
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" -m dte_backend hook-driver --help
          "$RUNNER_TEMP/dte-wheel-venv/bin/dte-backend" hook-driver --help
      - name: Verify repository Skill bundle
        run: |
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" scripts/install_skill_bundle.py --source . --target "$RUNNER_TEMP/dte-installed-skill"
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" "$RUNNER_TEMP/dte-installed-skill/scripts/dte_hook_driver_entry.py" hook-driver --help
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path.cwd()
          required = [
              root / "SKILL.md",
              root / "hooks" / "dte_enforcement_hook.py",
              root / "bundle-manifest.json",
              root / "scripts" / "dte_hook_driver_entry.py",
              root / "scripts" / "install_dte_hooks.py",
              root / "deploy" / "managed-template" / "requirements.toml",
              root / "deploy" / "managed-template" / "hooks" / "dte_enforcement_hook.py",
              root / "deploy" / "managed-template" / "bundle-manifest.json",
          ]
          missing = [str(path.relative_to(root)) for path in required if not path.is_file()]
          assert not missing, f"missing repository Skill files: {missing}"
          source = required[1].read_bytes()
          assert required[6].read_bytes() == source
          assert required[2].read_bytes() == required[7].read_bytes()
          digest = hashlib.sha256(source).hexdigest()
          requirements = required[5].read_text(encoding="utf-8")
          assert requirements.count(f"--dte-hook-content-sha256={digest}") == 10
          assert requirements.count("--dte-skill-root=") == 10
          PY
          "$RUNNER_TEMP/dte-wheel-venv/bin/python" scripts/install_dte_hooks.py --scope managed-template
