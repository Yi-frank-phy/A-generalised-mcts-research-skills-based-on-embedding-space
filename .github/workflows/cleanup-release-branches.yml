name: Cleanup release branches

on:
  push:
    branches:
      - new
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.ref == 'refs/heads/new'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Make new the default branch when permitted
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" -f default_branch=new
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "GitHub Actions token cannot change the repository default branch; continuing with deletable branch cleanup."
          fi
      - name: Delete every branch except new and old
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin | while read -r _ ref; do
            branch="${ref#refs/heads/}"
            case "$branch" in
              new|old)
                echo "keep $branch"
                ;;
              *)
                echo "delete $branch"
                if ! git push origin --delete "$branch"; then
                  echo "could not delete $branch (normally this means it is still the default branch)"
                fi
                ;;
            esac
          done
      - name: Show remaining branches
        shell: bash
        run: git ls-remote --heads origin
