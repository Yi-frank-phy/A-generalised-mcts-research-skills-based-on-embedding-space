name: P0 Sync Managed Manifest

on:
  push:
    branches:
      - fix/p0-adaptive-kde-scale
    paths:
      - .github/workflows/p0-sync-managed-manifest.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/p0-adaptive-kde-scale
      - name: Sync exact production manifest mirror
        run: |
          cp bundle-manifest.json deploy/managed-template/bundle-manifest.json
          rm .github/workflows/p0-sync-managed-manifest.yml
      - name: Commit mirror sync and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: sync managed-template bundle manifest"
          git push origin HEAD:fix/p0-adaptive-kde-scale
